en:
  name: Omkar Oak
  title: Master's Student
  location: <a href="https://www.i.u-tokyo.ac.jp/index_e.shtml">Department of Information and Communication Engineering,The University of Tokyo</a>
  intro: I am currently a master's student at <a href="https://www.cvm.t.u-tokyo.ac.jp/en/index.html">Yamasaki Lab</a>, <a href="https://www.u-tokyo.ac.jp/en/">The University of Tokyo</a> and a recipient of the Japanese Government's <a href="https://www.mext.go.jp/a_menu/koutou/ryugaku/06032818.htm">MEXT scholarship</a>. I completed my Bachelor's degree in Computer Engineering from the <a href="https://www.coeptech.ac.in/">College of Engineering Pune</a>. I briefly worked as a Software Engineer at <a href="https://www.wellsfargo.com/">Wells Fargo</a> in the Instant Payments team. I'm interested in working on topics in Multimodal LLMs, VLMs, Computer Vision and Remote Sensing.
  extra: I <s>rarely</s> write Computer Science blogs on <a href="https://medium.com/@omkarsoak">Medium</a>. For fun blogs visit <a href="/blogs">here</a>. In my free time, you will find me playing chess or writing Kanji in a square notebook. Nonetheless, I am equally bad at both. I also enjoy climbing mountains and listening to Indian classical music.
  address: The University of Tokyo, 7-3-1 Hongo, Tokyo
  unused: During my engineering days, I was part of the <a href="">COEP Rowing Crew</a>. Falling into the Mutha river right on the warf is one of my achievements. 

ja:
  name: オーク・オムカール
  title: 修士課程 1年
  location: <a href="https://www.i.u-tokyo.ac.jp/index_e.shtml">情報通信工学部門、東京大学</a>
  intro: 私は現在、<a href="https://www.u-tokyo.ac.jp/en/">東京大学</a>の<a href="https://www.cvm.t.u-tokyo.ac.jp/en/index.html">山崎研究室</a>の修士課程の学生であり、日本政府の<a href="https://www.mext.go.jp/a_menu/ Koutou/ Ryuraku/06032818.htm">文部科学省奨学金</a>。私は <a href="https://www.coeptech.ac.in/">COEP</a> でコンピュータ エンジニアリングの学士号を取得しました。<a href="https://www.wellsfargo.com/">Wells Fargo</a> のインスタント・ペイメント（即時決済）チームで、短期間ソフトウェアエンジニアとして働いていました。私は、マルチモーダル LLM、VLM、コンピューター ビジョン、リモート センシングのトピックに取り組むことに興味があります。
  extra: <a href="https://medium.com/@omkarsoak">Medium</a> でコンピュータ サイエンスのブログを書いています。楽しいブログについては、<a href="/blogs">ここ</a>にアクセスしてください。自由時間には、チェスをしたり、正方形のノートに漢字を書いたりしています。それにもかかわらず、私はどちらも同じように苦手です。山登りやインドの古典音楽を聴くことも好きです。
  address: 東京都文京区本郷 7-3-1, 東京大学

