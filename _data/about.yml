  intro: I am currently a master's student at <a href="https://www.cvm.t.u-tokyo.ac.jp/en/index.html">Yamasaki Lab</a>, <a href="https://www.u-tokyo.ac.jp/en/">The University of Tokyo</a>. I completed my Bachelor's degree in Computer Engineering with a Minor in Quant Finance from the <a href="https://www.coeptech.ac.in/">College of Engineering Pune</a>. I'm interested in working on topics in Multimodal LLMs, Computer Vision and Remote Sensing.
