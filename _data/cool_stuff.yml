- title: "On C++"
  content: '"There are only two kinds of languages: the ones people complain about and the ones nobody uses."'
  author: "Bjarne Stroustrup"
  link: "https://en.wikipedia.org/wiki/Bjarne_Stroustrup"

- title: "On Computer Science"
  content: '"Computer Science is no more about computers than astronomy is about telescopes"'
  author: "SICP, Abelson and Sussman"
  link: "https://github.com/sarabander/sicp-pdf"

- title: "Stigler's law"
  content: "states that no Discovery is ever actually named after the first person to discover it. Appropriately, Stephen Stigler was not the first person to notice this (it was Robert Merton, though doubtlessly someone else noticed before him too) and so the name \"Stigler's law\" is an example of Stigler's law."
  author: "Stephen Stigler"
  link: "https://en.wikipedia.org/wiki/Stephen_Stigler"

- title: "Addition to Hilbert's Slogan"
  content: '"We must know. We will know. But the truth is we do not know."'
  author: "Math's Fundamental Flaw, Veritasium"
  link: "https://youtu.be/HeQX2HjkcNo?si=Bkob8Q6lj6kouNhP"

- title: "On Familiarity"
  content: '"It took me some time to realize why I keep coming back to this place. To the attendant, in her spectacles, and face-mask. To the small enclosure contained within those four walls with their white paint tearing up in some places. To the servers, with their plates, and to the food topped with Ghee. I was looking for a word, a feeling to explain this behavior. I know what it is now. Familiarity."'
  author: "Ghee Sakhar, by Mihir Jain"
  link: "https://mihirjain.blogspot.com/2023/11/ghee-shakar.html"